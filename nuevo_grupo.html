<html>
<head>
<title>Sistema de Tareas - Nuevo Grupo</title>
</head>

<body bgcolor="#3C3C3C">
<center>

<font face="Algerian" size="15" color="#FFFFFF">SISTEMA DE TAREAS</font>
<p>
<font face="Algerian" size="6" color="#FFFFFF">Crear Grupo</font>

<hr>

<form action="nuevo_grupo.php" method="post">
<table border="2" bgcolor="#FF66FF" bordercolor="#7E02FD">

 <tr>
  <td bgcolor="#FFFFFF">Materia:</td>
  <td><input type="text" size="50" name="materia"></td>
 </tr>

 <tr>
  <td bgcolor="#FFFFFF">Semestre:</td>
  <td align="center">
   <select name="semestre">
    <option value="">Selecciona</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
   </select>
  </td>
 </tr>

 <tr>
  <td bgcolor="#FFFFFF">Carrera:</td>
  <td align="center">
   <select name="carrera">
    <option value="">Selecciona</option>
    <!-- Aqui van las carreras de tu plantel -->
    <option value="10">Informatica (10)</option>
    <option value="20">Contabilidad (20)</option>
    <option value="30">Administracion (30)</option>
   </select>
  </td>
 </tr>

 <!-- El numero de grupo se forma en PHP concatenando semestre + carrera -->
 <!-- Ejemplo: semestre 4 + carrera 10 = grupo 410 -->
 <!-- En PHP: $grupo = $semestre . $carrera; -->

 <tr>
  <td bgcolor="#FFFFFF">Codigo de acceso:</td>
  <td>
   <input type="text" size="20" name="codigo">
   <br>
   <font size="2">Los alumnos usaran este codigo para unirse</font>
  </td>
 </tr>

 <tr>
  <td colspan="2" align="center" bgcolor="#FFFFFF">
   <input type="submit" value="Crear Grupo">
  </td>
 </tr>

</table>
</form>

<p>
<a href="panel_profesor.html"><font color="#FFFFFF">Volver al panel</font></a>

</center>
</body>
</html>
